name: Docker

on:
  workflow_dispatch:
    inputs:
      extra_tag:
        description: 'Additional tag to push alongside the template tag (e.g. v1.2.3, leave empty for none)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      packages: write # 必须授权以推送镜像
    strategy:
      fail-fast: false
      matrix:
        template: [claude-code, codex, gemini]
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          TAGS="ghcr.io/${{ github.actor }}/${{ github.event.repository.name }}:${{ matrix.template }}"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/${{ matrix.template }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.template }}
          cache-to: type=gha,mode=max,scope=${{ matrix.template }}

      - uses: actions/delete-package-versions@v5
        with: 
          package-name: ${{ env.CONTAINER_NAME }}
          package-type: 'container'
          min-versions-to-keep: 2
          delete-only-untagged-versions: 'true'