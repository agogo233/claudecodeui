name: "Publish Server Container Image"
on:
  push:
  workflow_dispatch:
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      packages: write # 必须授权以推送镜像
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 3

      - name: Set Vars
        run: |
          CONTAINER_NAME="${{ github.event.repository.name }}"
          echo "CONTAINER_NAME=$CONTAINER_NAME" >> $GITHUB_ENV
          LOWER_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "LOWER_NAME=$LOWER_NAME" >> $GITHUB_ENV
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: 设置 QEMU 支持多架构
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile.DIY
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.LOWER_NAME }}:latest

      - name: 输出镜像体积
        run: |
          IMAGE="ghcr.io/${{ env.LOWER_NAME }}:latest"
          docker buildx imagetools inspect "$IMAGE" --raw > "${{ runner.temp }}/manifest.json"
          # 单架构：raw 直接是 image manifest，含 layers
          if jq -e 'has("layers")' "${{ runner.temp }}/manifest.json" > /dev/null; then
            echo "镜像压缩体积: $(jq '([.layers[].size] | add) / 1048576 | floor' "${{ runner.temp }}/manifest.json") MB"
            exit 0
          fi
          # 多架构 index：按 digest 逐个取内层 manifest 计算层体积（跳过 attestation）
          jq -r '.manifests[] | select(.platform.os != "unknown") | "\(.platform.os)/\(.platform.architecture) \(.digest)"' \
            "${{ runner.temp }}/manifest.json" | \
          while read -r os_arch digest; do
            size=$(docker buildx imagetools inspect "$IMAGE@$digest" --raw \
              | jq '([.layers[].size] | add) / 1048576 | floor')
            echo "$os_arch: ${size} MB (压缩)"
          done

      - uses: actions/delete-package-versions@v5
        with: 
          package-name: ${{ env.CONTAINER_NAME }}
          package-type: 'container'
          min-versions-to-keep: 2
          delete-only-untagged-versions: 'true'